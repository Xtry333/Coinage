name: ${COMPOSE_PROJECT_NAME:-coinage-app}

services:
    coinage-db:
        image: postgres:18.6-alpine
        platform: linux/arm64
        pull_policy: never
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${COINAGE_POSTGRES_DB:-coinage-db}
            POSTGRES_USER: ${COINAGE_POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${COINAGE_POSTGRES_PASSWORD:?Set COINAGE_POSTGRES_PASSWORD in the target directory's .env}
        ports:
            - '${COINAGE_POSTGRES_PORT:-5432}:5432'
        volumes:
            - ./data/pg:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    coinage-api:
        image: coinage-api:latest
        platform: linux/arm64
        pull_policy: never
        restart: unless-stopped
        env_file:
            - ./.env
        environment:
            NODE_ENV: production
            COINAGE_POSTGRES_HOST: coinage-db
            COINAGE_POSTGRES_PORT: '5432'
            COINAGE_POSTGRES_DB: ${COINAGE_POSTGRES_DB:-coinage-db}
            COINAGE_POSTGRES_USER: ${COINAGE_POSTGRES_USER:-postgres}
            COINAGE_POSTGRES_PASSWORD: ${COINAGE_POSTGRES_PASSWORD:?Set COINAGE_POSTGRES_PASSWORD in the target directory's .env}
            COINAGE_API_JWT_SECRET: ${COINAGE_API_JWT_SECRET:?Set COINAGE_API_JWT_SECRET in the target directory's .env}
            COINAGE_ADMIN_USERNAME: ${COINAGE_ADMIN_USERNAME:?Set COINAGE_ADMIN_USERNAME for initial admin bootstrap}
            COINAGE_ADMIN_PASSWORD: ${COINAGE_ADMIN_PASSWORD:?Set COINAGE_ADMIN_PASSWORD for initial admin bootstrap}
        volumes:
            - ./data/uploads:/app/api/uploads
        depends_on:
            coinage-db:
                condition: service_healthy

    coinage-webapp:
        image: coinage-webapp:latest
        platform: linux/arm64
        pull_policy: never
        restart: unless-stopped
        ports:
            - ${COINAGE_WEBAPP_PORT:-4200}:80
        depends_on:
            - coinage-api
