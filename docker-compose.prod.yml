services:
    coinage-db:
        restart: unless-stopped
        image: postgres:15-alpine
        environment:
            POSTGRES_DB: ${PG_DATABASE:-coinage-db}
            POSTGRES_USER: ${PG_USER:-postgres}
            POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
        ports:
            - ${COINAGE_PG_PORT:-5432}:5432
        volumes:
            - ./docker/postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-postgres}']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    coinage-api:
        restart: unless-stopped
        image: ghcr.io/${COINAGE_REGISTRY_USER:-Xtry333}/coinage-api:latest
        environment:
            PG_HOST: coinage-db
            COINAGE_PG_PORT: 5432
            COINAGE_API_JWT_SECRET: ${COINAGE_API_JWT_SECRET:-change-me}
            PG_DATABASE: ${PG_DATABASE:-coinage-db}
            PG_USER: ${PG_USER:-postgres}
            PG_PASSWORD: ${PG_PASSWORD:-password}
        ports:
            - ${COINAGE_API_PORT:-3333}:3333
        depends_on:
            coinage-db:
                condition: service_healthy

    coinage-webapp:
        restart: unless-stopped
        image: ghcr.io/${COINAGE_REGISTRY_USER:-Xtry333}/coinage-webapp:latest
        ports:
            - ${COINAGE_WEBAPP_PORT:-4200}:80
        depends_on:
            - coinage-api
