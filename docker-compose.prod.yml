services:
    coinage-db:
        restart: unless-stopped
        image: postgres:18.6-alpine
        environment:
            POSTGRES_DB: ${COINAGE_POSTGRES_DB:-coinage-db}
            POSTGRES_USER: ${COINAGE_POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${COINAGE_POSTGRES_PASSWORD:?Set COINAGE_POSTGRES_PASSWORD in the production env file}
        volumes:
            - ./data/pg:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    coinage-api:
        restart: unless-stopped
        image: ghcr.io/${COINAGE_REGISTRY_USER:-xtry333}/coinage-api:${COINAGE_IMAGE_TAG:?Set COINAGE_IMAGE_TAG to a published release tag}
        environment:
            NODE_ENV: production
            COINAGE_POSTGRES_HOST: coinage-db
            COINAGE_POSTGRES_PORT: '5432'
            COINAGE_API_JWT_SECRET: ${COINAGE_API_JWT_SECRET:?Set COINAGE_API_JWT_SECRET in the production env file}
            COINAGE_ADMIN_USERNAME: ${COINAGE_ADMIN_USERNAME:?Set COINAGE_ADMIN_USERNAME before the first migration}
            COINAGE_ADMIN_PASSWORD: ${COINAGE_ADMIN_PASSWORD:?Set COINAGE_ADMIN_PASSWORD before the first migration}
            COINAGE_POSTGRES_DB: ${COINAGE_POSTGRES_DB:-coinage-db}
            COINAGE_POSTGRES_USER: ${COINAGE_POSTGRES_USER:-postgres}
            COINAGE_POSTGRES_PASSWORD: ${COINAGE_POSTGRES_PASSWORD:?Set COINAGE_POSTGRES_PASSWORD in the production env file}
        volumes:
            - ./data/uploads:/app/api/uploads
        depends_on:
            coinage-db:
                condition: service_healthy

    coinage-webapp:
        restart: unless-stopped
        image: ghcr.io/${COINAGE_REGISTRY_USER:-xtry333}/coinage-webapp:${COINAGE_IMAGE_TAG:?Set COINAGE_IMAGE_TAG to a published release tag}
        ports:
            - ${COINAGE_WEBAPP_PORT:-4200}:80
        depends_on:
            - coinage-api
