>
    <div class="overflow-hidden text-center text-xs leading-tight font-semibold tracking-wide text-ellipsis whitespace-nowrap text-gray-600">
        {{ lowerLabel }}
    </div>
    <div class="flex items-baseline justify-center gap-1.5">
        <span class="min-w-0 shrink overflow-hidden text-3xl font-bold text-ellipsis whitespace-nowrap text-gray-900 tabular-nums">{{ displayValue }}</span>
