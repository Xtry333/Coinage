services:
    coinage-db:
        restart: unless-stopped
        image: postgres:15-alpine
        env_file:
            - ./.env
        ports:
            - 5432:5432
        volumes:
            - ./docker/postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-postgres}"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
    coinage-api:
        build:
            context: .
            dockerfile: docker/api.Dockerfile
        image: coinage-api
        environment:
            PG_HOST: coinage-db
        env_file:
            - ./.env
        ports:
            - 3333:3333
        depends_on:
            coinage-db:
                condition: service_healthy
    coinage-webapp:
        build:
            context: .
            dockerfile: docker/webapp.Dockerfile
        image: coinage-webapp
        ports:
            - 4200:4200
        depends_on:
            - coinage-api
