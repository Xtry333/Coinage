services:
    coinage-db:
        restart: unless-stopped
        image: postgres:18.6-alpine
        environment:
            POSTGRES_DB: ${COINAGE_POSTGRES_DB:-coinage-db}
            POSTGRES_USER: ${COINAGE_POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${COINAGE_POSTGRES_PASSWORD:-password}
        ports:
            - '${COINAGE_POSTGRES_PORT:-5432}:5432'
        volumes:
            - ./data/pg:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${COINAGE_POSTGRES_USER:-postgres} -d ${COINAGE_POSTGRES_DB:-coinage-db}']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
    coinage-api:
        build:
            context: .
            dockerfile: docker/api.Dockerfile
        image: coinage-api
        environment:
            COINAGE_POSTGRES_HOST: coinage-db
            COINAGE_POSTGRES_PORT: '5432'
        env_file:
            - ./.env
        ports:
            - 3333:3333
        volumes:
            - ./data/uploads:/app/api/uploads
        depends_on:
            coinage-db:
                condition: service_healthy
    coinage-webapp:
        build:
            context: .
            dockerfile: docker/webapp.Dockerfile
        image: coinage-webapp
        ports:
            - 4200:80
        depends_on:
            - coinage-api
